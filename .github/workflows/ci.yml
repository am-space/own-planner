name: CI

on:
  push:
    branches: [ master, main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master, main ]

permissions:
  contents: read
  packages: write

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine version
        id: version
        shell: bash
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          if [[ "$REF_TYPE" == "tag" && "$REF_NAME" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            APP_VERSION="${BASH_REMATCH[1]}"
            APP_FILE_VERSION="${APP_VERSION}.0"
            echo "app_version=$APP_VERSION" >> "$GITHUB_OUTPUT"
            echo "app_file_version=$APP_FILE_VERSION" >> "$GITHUB_OUTPUT"
            echo "is_release=true" >> "$GITHUB_OUTPUT"
            {
              echo "image_tags<<EOF"
              echo "ghcr.io/$REPOSITORY:v$APP_VERSION"
              echo "ghcr.io/$REPOSITORY:latest"
              echo "ghcr.io/$REPOSITORY:$SHA"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            echo "app_version=0.0.0-local" >> "$GITHUB_OUTPUT"
            echo "app_file_version=0.0.0.0" >> "$GITHUB_OUTPUT"
            echo "is_release=false" >> "$GITHUB_OUTPUT"
            {
              echo "image_tags<<EOF"
              echo "ghcr.io/$REPOSITORY:$SHA"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GitHub Container Registry
        if: steps.version.outputs.is_release == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: OwnPlanner.Web/ownplanner.web.client/package-lock.json

      - name: Install and restore dependencies
        env:
          APP_VERSION: ${{ steps.version.outputs.app_version }}
          APP_FILE_VERSION: ${{ steps.version.outputs.app_file_version }}
        run: ./scripts/setup.sh

      - name: Verify frontend
        run: ./scripts/verify.sh --frontend

      - name: Verify backend
        env:
          APP_VERSION: ${{ steps.version.outputs.app_version }}
          APP_FILE_VERSION: ${{ steps.version.outputs.app_file_version }}
        run: ./scripts/verify.sh --backend

      - name: Verify E2E
        run: ./scripts/verify.sh --e2e

      - name: Upload E2E failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure-artifacts
          path: TestResults/E2E
          if-no-files-found: ignore

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: OwnPlanner.Web/OwnPlanner.Web.Server/Dockerfile
          tags: ${{ steps.version.outputs.image_tags }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.app_version }}
            APP_FILE_VERSION=${{ steps.version.outputs.app_file_version }}
          push: ${{ steps.version.outputs.is_release == 'true' }}
          load: ${{ steps.version.outputs.is_release != 'true' }}
